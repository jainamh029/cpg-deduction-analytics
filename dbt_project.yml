name: cpg_deductions
version: "0.1.0"
config-version: 2
profile: cpg_deductions

model-paths: ["models"]
macro-paths: ["macros"]

vars:
  # Mirrors data_gen.config.Config.end_date (a test asserts they agree).
  as_of_date: "2025-12-31"
  raw_schema: raw

on-run-start:
  - "{{ create_metric_macros() }}"

clean-targets: ["target", "dbt_packages"]

models:
  cpg_deductions:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
    metrics:
      +schema: metrics
      +materialized: view
