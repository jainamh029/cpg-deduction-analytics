name: ci

# UNVERIFIED: this workflow has not run on GitHub yet. It is validated only as YAML and mirrors `make all`.
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # make all = setup, lint (ruff), data (synthetic warehouse), build (dbt build + data tests),
      # forecast (backtest), test (pytest)
      - run: make all PY=python3.11
