<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard - CPG deduction analytics (synthetic data)</title>
<style>
 :root{--ink:#1f2937;--muted:#64748b;--accent:#2563eb;--alert:#d9480f;--bg:#fff;--soft:#f1f5f9;--line:#cbd5e1}
 @media (prefers-color-scheme: dark){:root{--ink:#e5e7eb;--muted:#94a3b8;--accent:#60a5fa;--alert:#fb923c;--bg:#0f172a;--soft:#1e293b;--line:#334155}}
 *{box-sizing:border-box} body{font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg);margin:0}
 .banner{background:#fef3c7;color:#78350f;padding:.5rem 1rem;font-size:.9rem}
 header{display:flex;flex-wrap:wrap;gap:.5rem 1.2rem;align-items:center;padding:.6rem 1rem;background:var(--soft);border-bottom:1px solid var(--line)}
 header a{color:var(--accent);text-decoration:none;font-size:.9rem} header h1{font-size:1.05rem;margin:0}
 .tabs button{font:inherit;padding:.35rem .8rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;border-radius:6px;margin-right:.3rem}
 .tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
 .layout{display:grid;grid-template-columns:230px 1fr;gap:1rem;padding:1rem;max-width:84rem;margin:0 auto}
 @media (max-width:800px){.layout{grid-template-columns:1fr}}
 aside{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:.8rem;align-self:start;font-size:.88rem}
 aside h3{margin:.6rem 0 .3rem;font-size:.85rem;text-transform:uppercase;color:var(--muted)} aside label{display:block;white-space:nowrap}
 aside select{width:100%;margin-bottom:.3rem} .mini{font-size:.78rem;margin-left:.4rem;cursor:pointer;color:var(--accent);background:none;border:0}
 .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem;margin-bottom:1rem}
 .kpi{border:1px solid var(--line);border-radius:8px;padding:.6rem .8rem} .kpi small{color:var(--muted);display:block}
 .kpi b{font-size:1.5rem} .card{border:1px solid var(--line);border-radius:8px;padding:.6rem;margin-bottom:1rem;overflow:hidden}
 .note{color:var(--muted);font-size:.85rem;margin:.2rem 0 .8rem} table{border-collapse:collapse;width:100%;font-size:.85rem}
 th,td{border-bottom:1px solid var(--line);padding:.25rem .5rem;text-align:left} td.n,th.n{text-align:right}
 .vega-embed{width:100%;display:block} .empty{padding:2rem;text-align:center;color:var(--muted)} .scroll{max-height:420px;overflow:auto}
</style></head><body>
<div class="banner"><strong>All data is synthetic.</strong> Fictional brand, generated by code; not Confido's data or schema. Findings demonstrate a method on planted patterns.</div>
<header><h1>CPG deduction analytics</h1>
 <span class="tabs"><button data-page="sales">VP Sales: retailer performance</button><button data-page="ops">AR manager: deduction operations</button><button data-page="cfo">CFO: cash impact</button></span>
 <a href="../">Overview</a><a href="../memo.html">Findings memo</a><a href="../docs/AUDIT_REPORT.html">Audit</a></header>
<div class="layout">
 <aside id="filters"></aside>
 <main><div id="content"><div class="empty">Loading data...</div></div></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
<script>
"use strict";
const ACCENT = "#2563eb", MUTED = "#94a3b8", ALERT = "#d9480f";
const PAGES = {sales: "Retailer performance", ops: "Deduction operations", cfo: "Cash impact"};
let D = null;
const st = {page: "sales", retailers: new Set(), reasons: new Set(), from: "", to: ""};

const toObjects = cube => cube.rows.map(r => Object.fromEntries(cube.cols.map((c, i) => [c, r[i]])));
const sum = (xs, f) => xs.reduce((a, x) => a + (f(x) || 0), 0);
const div = (a, b) => (b ? a / b : null);
const money = v => v == null || isNaN(v) ? "n/a" : (v < 0 ? "-" : "") + (Math.abs(v) >= 1e6 ? "$" + (Math.abs(v) / 1e6).toFixed(1) + "M" : Math.abs(v) >= 1e3 ? "$" + (Math.abs(v) / 1e3).toFixed(0) + "K" : "$" + Math.abs(v).toFixed(0));
const pct = (v, d = 1) => v == null || isNaN(v) ? "n/a" : (v * 100).toFixed(d) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const label = c => c.replace(/_/g, " ").replace(/^./, m => m.toUpperCase());
const median = xs => { const s = [...xs].sort((a, b) => a - b), n = s.length; return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : null; };
const wrapTitle = t => { const out = []; let line = ""; for (const w of t.split(" ")) { if ((line + " " + w).length > 78) { out.push(line); line = w; } else line = line ? line + " " + w : w; } out.push(line); return out; };

const fR = x => st.retailers.has(x.r), fC = x => st.reasons.has(x.c), fM = x => x.m >= st.from && x.m <= st.to;
const name = id => D.names[id];

function chart(spec) {
  const card = document.createElement("div"); card.className = "card"; const el = document.createElement("div"); card.appendChild(el);
  $content.appendChild(card);
  vegaEmbed(el, {$schema: "https://vega.github.io/schema/vega-lite/v5.json", width: "container", autosize: {type: "fit", contains: "padding"}, ...spec,
    title: {text: wrapTitle(spec.title), anchor: "start", fontSize: 14}}, {actions: false});
}
function kpis(items) {
  const d = document.createElement("div"); d.className = "kpis";
  d.innerHTML = items.map(([l, v]) => `<div class="kpi"><small>${esc(l)}</small><b>${esc(v)}</b></div>`).join("");
  $content.appendChild(d);
}
function html(markup) { const d = document.createElement("div"); d.innerHTML = markup; $content.appendChild(d); }
function table(cols, rows, cls) {
  html(`<div class="card scroll"><table><thead><tr>${cols.map((c, i) => `<th class="${cls[i] || ""}">${esc(c)}</th>`).join("")}</tr></thead><tbody>` +
    rows.map(r => `<tr>${r.map((v, i) => `<td class="${cls[i] || ""}">${esc(v)}</td>`).join("")}</tr>`).join("") + "</tbody></table></div>");
}
function bars(rows, valueField, fmt, title, highlight) {
  chart({data: {values: rows}, mark: "bar", height: Math.max(120, 24 * rows.length), title,
    encoding: {y: {field: "name", type: "nominal", sort: "-x", title: null, axis: {labelLimit: 160, labelOverlap: false}},
      x: {field: valueField, type: "quantitative", axis: {format: fmt}, title: null},
      color: {condition: {test: `datum.name === '${highlight}'`, value: ALERT}, value: MUTED},
      tooltip: [{field: "name"}, {field: valueField, format: fmt}]}});
}

// ---------------------------------------------------------------- pages
function sales() {
  $content.insertAdjacentHTML("beforeend", `<p class="note">For the VP Sales. Date filter = <b>invoice month</b> (invoice-cohort basis). Invoices from the last 4 months before ${D.meta.as_of} are incomplete, so the overall rate is understated and the trend below excludes them.</p>`);
  const gross = D.gross.filter(x => fR(x) && fM(x)), coh = D.cohort.filter(x => fR(x) && fC(x) && fM(x));
  const G = sum(gross, x => x.gross), Dd = sum(coh, x => x.amt), Rc = sum(coh, x => x.rec);
  kpis([["Gross invoiced", money(G)], ["Deduction rate", pct(div(Dd, G))], ["Net revenue after deductions", money(G - Dd + Rc)], ["Recovery rate", pct(div(Rc, Dd))]]);
  const per = [...st.retailers].map(r => {
    const g = gross.filter(x => x.r === r), c = coh.filter(x => x.r === r);
    const gr = sum(g, x => x.gross), dd = sum(c, x => x.amt);
    return {id: r, name: name(r), gross: gr, ded: dd, rate: div(dd, gr), rec: div(sum(c, x => x.rec), dd), late: div(sum(g, x => x.late_sum), sum(g, x => x.late_w))};
  }).filter(p => p.gross > 0).sort((a, b) => b.rate - a.rate);
  if (!per.length) return html('<div class="empty">No invoices match these filters.</div>');
  bars(per.map(p => ({name: p.name, rate: p.rate})), "rate", ".1%", `${per[0].name} has the highest deduction rate at ${pct(per[0].rate)}, against ${pct(div(Dd, G))} for the selected portfolio`, per[0].name);

  const months = [...new Set(gross.filter(x => x.mature).map(x => x.m))].sort();
  const trend = [];
  for (const r of st.retailers) for (const m of months) {
    const g = sum(gross.filter(x => x.r === r && x.m === m), x => x.gross);
    if (g) trend.push({retailer: name(r), month: m + "-01", rate: sum(coh.filter(x => x.r === r && x.m === m), x => x.amt) / g});
  }
  const half = Math.ceil(months.length / 2), portfolio = ms => div(sum(coh.filter(x => ms.includes(x.m)), x => x.amt), sum(gross.filter(x => ms.includes(x.m)), x => x.gross));
  let tt = "Not enough mature months in this range to compare halves of the period";
  if (months.length >= 2) {
    const a = portfolio(months.slice(0, half)), b = portfolio(months.slice(half)), word = b - a > 0.0005 ? "rose" : a - b > 0.0005 ? "fell" : "held steady";
    tt = `Portfolio deduction rate ${word}: ${pct(a)} in the first half of the period vs ${pct(b)} in the second (mature months only)`;
  }
  if (trend.length) chart({data: {values: trend}, mark: {type: "line"}, height: 320, title: tt,
    encoding: {x: {field: "month", type: "temporal", title: null}, y: {field: "rate", type: "quantitative", axis: {format: ".0%"}, title: null},
      color: {field: "retailer", type: "nominal", legend: {title: null}}, tooltip: [{field: "retailer"}, {field: "month", type: "temporal", format: "%b %Y"}, {field: "rate", format: ".1%"}]}});
  const late = per.filter(p => p.late != null).sort((a, b) => b.late - a.late);
  if (late.length) bars(late.map(p => ({name: p.name, late: p.late})), "late", ".0f", `${late[0].name} pays furthest past due: ${late[0].late.toFixed(0)} days after the due date on average, versus a median of ${median(late.map(p => p.late)).toFixed(0)} days across retailers`, late[0].name);
  html("<h3>Retailer scorecard</h3>");
  table(["Retailer", "Gross", "Deductions", "Deduction rate", "Recovery rate", "Days past due"],
    per.map(p => [p.name, money(p.gross), money(p.ded), pct(p.rate), pct(p.rec), p.late == null ? "n/a" : p.late.toFixed(1)]), ["", "n", "n", "n", "n", "n"]);
}

function ops() {
  $content.insertAdjacentHTML("beforeend", `<p class="note">For the AR manager. Date filter = <b>deduction month</b>. Win rate counts resolved disputes only (pending excluded); days to resolve is the mean over resolved disputes, so it is biased toward fast outcomes.</p>`);
  const ded = D.deductions.filter(x => fR(x) && fC(x) && fM(x));
  const resolved = sum(ded, x => x.resolved);
  kpis([["Open deduction balance", money(sum(ded, x => x.open_amt))], ["Open items", sum(ded, x => x.open_n).toLocaleString()],
        ["Dispute win rate", pct(div(sum(ded, x => x.wins), resolved))], ["Mean days to resolve", (v => v == null ? "n/a" : v.toFixed(0))(div(sum(ded, x => x.days_sum), sum(ded, x => x.days_n)))]]);
  const open = D.open.filter(x => fR(x) && fC(x) && fM(x));
  if (!open.length) html('<div class="empty">No open deductions match these filters.</div>');
  else {
    const agg = {}; for (const x of open) agg[x.b + "|" + x.c] = (agg[x.b + "|" + x.c] || 0) + x.amt;
    const values = Object.entries(agg).map(([k, v]) => ({bucket: k.split("|")[0], reason: label(k.split("|")[1]), amt: v}));
    const oldest = values.map(v => v.bucket).sort().pop(), total = sum(values, v => v.amt), old = sum(values.filter(v => v.bucket === oldest), v => v.amt);
    chart({data: {values}, mark: "bar", height: 300, title: `${money(old)} of the ${money(total)} open balance sits in the oldest age bucket (${oldest} days)`,
      encoding: {x: {field: "bucket", type: "ordinal", title: "Days since deduction"}, y: {field: "amt", type: "quantitative", aggregate: "sum", axis: {format: "$~s"}, title: null},
        color: {field: "reason", type: "nominal", legend: {title: "Reason"}}, tooltip: [{field: "bucket"}, {field: "reason"}, {field: "amt", aggregate: "sum", format: "$,.0f"}]}});
  }
  const mix = [...st.reasons].map(c => {
    const g = ded.filter(x => x.c === c), rs = sum(g, x => x.resolved);
    return {reason: label(c), dispute: div(sum(g, x => x.disp), sum(g, x => x.amt)), win: div(sum(g, x => x.wins), rs)};
  }).filter(m => m.win != null && m.dispute != null).sort((a, b) => b.win - a.win);
  if (mix.length) {
    const top = [...mix].sort((a, b) => (b.win - b.dispute) - (a.win - a.dispute))[0];
    chart({data: {values: mix.flatMap(m => [{reason: m.reason, measure: "Share of dollars disputed", rate: m.dispute}, {reason: m.reason, measure: "Disputes won (full or partial)", rate: m.win}])},
      mark: "bar", height: 300, title: `${top.reason} deductions win ${pct(top.win, 0)} of disputes, yet only ${pct(top.dispute, 0)} of their dollars are disputed`,
      encoding: {x: {field: "reason", type: "nominal", title: null, sort: mix.map(m => m.reason)}, xOffset: {field: "measure"}, y: {field: "rate", type: "quantitative", axis: {format: "%"}, title: null},
        color: {field: "measure", type: "nominal", scale: {domain: ["Share of dollars disputed", "Disputes won (full or partial)"], range: [MUTED, ACCENT]}, legend: {title: null}}, tooltip: [{field: "reason"}, {field: "measure"}, {field: "rate", format: ".1%"}]}});
  }
  const lag = {}; for (const x of D.lag.filter(x => fR(x) && fC(x) && fM(x))) { const l = lag[x.b] || (lag[x.b] = {resolved: 0, wins: 0}); l.resolved += x.resolved; l.wins += x.wins; }
  const co = Object.entries(lag).filter(([, v]) => v.resolved).sort().map(([b, v]) => ({bucket: b, win: v.wins / v.resolved}));
  if (co.length >= 2) chart({data: {values: co}, mark: {type: "bar", color: ACCENT}, height: 260,
    title: `Disputes filed within ${co[0].bucket} days win ${pct(co[0].win, 0)}; those filed after ${co[co.length - 1].bucket} days win ${pct(co[co.length - 1].win, 0)}`,
    encoding: {x: {field: "bucket", type: "ordinal", title: "Days from deduction to filing"}, y: {field: "win", type: "quantitative", axis: {format: "%"}, title: null}, tooltip: [{field: "bucket"}, {field: "win", format: ".1%"}]}});
  html(`<h3>Worklist: top 50 open, never-disputed deductions by expected recovery</h3>`);
  const wl = D.worklist.filter(x => fR(x) && fC(x) && x.d.slice(0, 7) >= st.from && x.d.slice(0, 7) <= st.to).slice(0, 50);
  if (!wl.length) return html('<div class="empty">Nothing to work with these filters.</div>');
  table(["Deduction", "Retailer", "Reason", "Deducted (month)", "Age (days)", "Bucket", "Amount", "Expected recovery"],
    wl.map(x => [x.id, name(x.r), label(x.c), x.d, x.age, x.b, money(x.amt), money(x.exp)]), ["", "", "", "", "n", "", "n", "n"]);
}

function cfo() {
  $content.insertAdjacentHTML("beforeend", `<p class="note">For the CFO. Date filter = <b>deduction month</b>. The forecast covers all reasons and ignores the reason filter. Recoverable dollars are a range: they depend on assumed realization factors and on dispute-selection bias (see the findings memo).</p>`);
  const ded = D.deductions.filter(x => fR(x) && fC(x) && fM(x)), cand = D.candidates.filter(x => fR(x) && fC(x) && fM(x));
  const fac = Object.fromEntries(D.scenarios.map(s => [s.scenario, s.factor])), W = D.meta.windows, mid = W[Math.floor(W.length / 2)];
  const rec = (w, s) => sum(cand.filter(x => x.w <= w), x => x.exp) * fac[s];
  kpis([["Cash tied up in open deductions", money(sum(ded, x => x.open_amt))], [`Recoverable (${mid}-day window, base case)`, money(rec(mid, "base"))],
        ["Deducted, net of recoveries", money(sum(ded, x => x.amt) - sum(ded, x => x.rec))]]);
  const grid = W.flatMap(w => D.scenarios.map(s => ({window: String(w), scenario: s.scenario, amt: rec(w, s.scenario)})));
  chart({data: {values: grid}, mark: "bar", height: 300,
    title: `Base case: ${money(rec(mid, "base"))} is recoverable from never-disputed deductions within ${mid} days (${money(rec(mid, "low"))} to ${money(rec(mid, "high"))} across scenarios)`,
    encoding: {x: {field: "window", type: "ordinal", sort: W.map(String), title: "Dispute window (days)"}, xOffset: {field: "scenario", sort: D.scenarios.map(s => s.scenario)},
      y: {field: "amt", type: "quantitative", axis: {format: "$~s"}, title: null}, color: {field: "scenario", type: "nominal", sort: D.scenarios.map(s => s.scenario), scale: {range: [MUTED, ACCENT, ALERT]}, legend: {title: "Scenario"}},
      tooltip: [{field: "window"}, {field: "scenario"}, {field: "amt", format: "$,.0f"}]}});
  const byR = [...st.retailers].map(r => ({name: name(r), amt: sum(ded.filter(x => x.r === r), x => x.open_amt)})).filter(x => x.amt > 0).sort((a, b) => b.amt - a.amt).slice(0, 10);
  if (byR.length) bars(byR, "amt", "$~s", `${byR[0].name} holds the largest open balance: ${money(byR[0].amt)} of cash tied up`, byR[0].name);
  const hist = {}; for (const x of D.deductions.filter(x => fR(x) && fM(x) && !x.burn)) hist[x.m] = (hist[x.m] || 0) + x.amt;
  const fwd = {}; for (const x of D.forecast.filter(fR)) { const f = fwd[x.m] || (fwd[x.m] = {hw: 0, p10: 0, p90: 0}); f.hw += x.hw; f.p10 += x.p10; f.p90 += x.p90; }
  const fm = Object.keys(fwd).sort();
  if (!Object.keys(hist).length || !fm.length) return html('<div class="empty">No forecast for these filters.</div>');
  const yearAgo = m => (+m.slice(0, 4) - 1) + m.slice(4), prior = sum(D.deductions.filter(x => st.retailers.has(x.r) && fm.map(yearAgo).includes(x.m)), x => x.amt);
  const total = sum(fm, m => fwd[m].hw), hm = Object.keys(hist).sort(), last = hm[hm.length - 1];
  const actual = hm.map(m => ({month: m + "-01", value: hist[m], series: "Actual"}));
  const proj = [{month: last + "-01", value: hist[last], series: "Holt-Winters forecast"}, ...fm.map(m => ({month: m + "-01", value: fwd[m].hw, series: "Holt-Winters forecast"}))];
  const band = fm.map(m => ({month: m + "-01", lo: fwd[m].p10, hi: fwd[m].p90}));
  chart({title: `Deductions are forecast at ${money(total)} over the next 3 months (80% band ${money(sum(fm, m => fwd[m].p10))} to ${money(sum(fm, m => fwd[m].p90))}), versus ${money(prior)} in the same months last year`, height: 320,
    layer: [{data: {values: actual}, mark: {type: "line", color: MUTED}, encoding: {x: {field: "month", type: "temporal", title: null}, y: {field: "value", type: "quantitative", axis: {format: "$~s"}, title: null}}},
            {data: {values: proj}, mark: {type: "line", color: ACCENT}, encoding: {x: {field: "month", type: "temporal"}, y: {field: "value", type: "quantitative"}}},
            {data: {values: band}, mark: {type: "area", opacity: 0.2, color: ACCENT}, encoding: {x: {field: "month", type: "temporal"}, y: {field: "lo", type: "quantitative"}, y2: {field: "hi"}}}]});
  html('<p class="note">Band = 10th to 90th percentile of pooled backtest errors (not model-based); measured out-of-sample coverage was lower than nominal (see the findings memo).</p>');
}

// ---------------------------------------------------------------- shell
const $content = document.getElementById("content");
function renderFilters() {
  const months = [...new Set(D.gross.map(x => x.m))].sort();
  const reasons = [...new Set(D.deductions.map(x => x.c))].sort();
  $("filters").innerHTML = `<h3>Retailers <button class="mini" data-all="r">all</button><button class="mini" data-none="r">none</button></h3>` +
    Object.entries(D.names).map(([id, n]) => `<label><input type="checkbox" data-r="${id}" ${st.retailers.has(+id) ? "checked" : ""}> ${esc(n)}</label>`).join("") +
    `<h3>Reason codes <button class="mini" data-all="c">all</button><button class="mini" data-none="c">none</button></h3>` +
    reasons.map(c => `<label><input type="checkbox" data-c="${c}" ${st.reasons.has(c) ? "checked" : ""}> ${esc(label(c))}</label>`).join("") +
    `<h3>Date range (month)</h3><select id="from">${months.map(m => `<option ${m === st.from ? "selected" : ""}>${m}</option>`).join("")}</select>` +
    `<select id="to">${months.map(m => `<option ${m === st.to ? "selected" : ""}>${m}</option>`).join("")}</select>` +
    `<p class="note">The date range filters invoice month on the sales page and deduction month on the other pages.</p>`;
}
function $(id) { return document.getElementById(id); }
function render() {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.page === st.page));
  $content.innerHTML = `<h2 style="margin-top:0">${PAGES[st.page]}</h2>`;
  if (!st.retailers.size || !st.reasons.size || st.from > st.to) return html('<div class="empty">Choose at least one retailer, one reason and a valid date range.</div>');
  ({sales, ops, cfo})[st.page]();
}
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.r) t.checked ? st.retailers.add(+t.dataset.r) : st.retailers.delete(+t.dataset.r);
  else if (t.dataset.c) t.checked ? st.reasons.add(t.dataset.c) : st.reasons.delete(t.dataset.c);
  else if (t.id === "from") st.from = t.value; else if (t.id === "to") st.to = t.value; else return;
  render();
});
document.addEventListener("click", e => {
  const t = e.target;
  if (t.dataset.page) { st.page = t.dataset.page; location.hash = st.page; render(); }
  const key = t.dataset.all || t.dataset.none;
  if (key) {
    const all = !!t.dataset.all;
    if (key === "r") st.retailers = new Set(all ? Object.keys(D.names).map(Number) : []); else st.reasons = new Set(all ? [...new Set(D.deductions.map(x => x.c))] : []);
    renderFilters(); render();
  }
});
fetch("data.json").then(r => r.json()).then(raw => {
  D = {meta: raw.meta, names: Object.fromEntries(toObjects(raw.retailers).map(x => [x.id, x.name])), scenarios: toObjects(raw.scenarios)};
  for (const k of ["deductions", "open", "lag", "gross", "cohort", "candidates", "worklist", "forecast"]) D[k] = toObjects(raw[k]);
  D.forecast = D.forecast.map(x => ({...x}));
  const months = [...new Set(D.gross.map(x => x.m))].sort();
  st.retailers = new Set(Object.keys(D.names).map(Number)); st.reasons = new Set(D.deductions.map(x => x.c)); st.from = months[0]; st.to = months[months.length - 1];
  const h = location.hash.slice(1); if (PAGES[h]) st.page = h;
  renderFilters(); render();
}).catch(err => { $content.innerHTML = `<div class="empty">Could not load data.json (${esc(err)}). If you opened this file directly, serve the folder instead: python -m http.server</div>`; });
</script></body></html>
