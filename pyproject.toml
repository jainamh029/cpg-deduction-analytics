[project]
name = "cpg-deduction-analytics"
version = "0.1.0"
description = "Synthetic-data analytics project: CPG retailer deductions and trade spend."
requires-python = ">=3.11,<3.12"
dependencies = [
    "dbt-core>=1.12,<1.13",
    "dbt-duckdb>=1.11,<1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "ruff>=0.16,<0.17",
]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
