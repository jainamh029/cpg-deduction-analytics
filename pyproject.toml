[project]
name = "cpg-deduction-analytics"
version = "0.1.0"
description = "Synthetic-data analytics project: CPG retailer deductions and trade spend."
requires-python = ">=3.11,<3.12"
dependencies = [
    "dbt-core==1.12.5",
    "dbt-duckdb==1.11.0",
    "duckdb==1.5.6",
    "numpy==2.4.6",
    "pandas==3.0.6",
    "statsmodels==0.15.0",
    "streamlit==1.65.0",
    "altair==6.3.0",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

screenshots = [
    "playwright==1.63.0",
]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Long string literals (SQL, report text) are left to the author; the formatter handles code.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
